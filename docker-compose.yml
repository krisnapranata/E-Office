# Menjalankan E-Office di port 8090 memakai MariaDB/MySQL dan Redis yang sudah ada di host.
# network_mode: host membuat DB_HOST=localhost di .env merujuk ke host, bukan ke container.
x-app: &app
  build: .
  image: eoffice:latest
  env_file: .env
  network_mode: host
  volumes:
    - eoffice_media:/app/media
  restart: unless-stopped

services:
  web:
    <<: *app
    container_name: eoffice-web
    environment:
      RUN_MIGRATIONS: "1"
      PORT: "8090"

  worker:
    <<: *app
    container_name: eoffice-worker
    command: sh -c 'exec celery -A config worker --loglevel=info --concurrency=2 -Q $${CELERY_QUEUE:-eoffice}'
    healthcheck:
      disable: true

  beat:
    <<: *app
    container_name: eoffice-beat
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

volumes:
  eoffice_media:
