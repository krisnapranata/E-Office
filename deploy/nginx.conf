# Nginx internal E-OFFICE (container eoffice_nginx, port host 8090).
# Di depannya: Nginx Proxy Manager yang memegang domain + sertifikat HTTPS.

# Teruskan protokol asli dari Nginx Proxy Manager; bila diakses langsung, pakai $scheme.
map $http_x_forwarded_proto $proto_asli {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Backend dipanggil dengan NAMA CONTAINER yang unik (eoffice_web), bukan nama service "web":
    # eoffice_nginx juga tergabung di network Nginx Proxy Manager, tempat aplikasi lain (mis. SIMBAK)
    # punya service bernama "web". Resolver Docker + variabel membuat alamat dibaca ulang (valid=10s)
    # sehingga tetap benar setelah eoffice_web dibuat ulang dengan IP baru.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $eoffice_web http://eoffice_web:8000;

    # Percayai X-Real-IP hanya dari jaringan privat (NPM/docker).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Sedikit di atas UPLOAD_MAX_BYTES (10 MB). Samakan di Nginx Proxy Manager.
    client_max_body_size 12m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # Statis dilayani WhiteNoise (berkas ber-hash, cache panjang); lampiran/bukti TIDAK pernah dilayani
    # langsung oleh Nginx — selalu lewat Django agar hak akses diperiksa dan unduhan tercatat di audit.
    location / {
        proxy_pass $eoffice_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_asli;
        proxy_read_timeout 120s;   # ekspor laporan Excel bisa beberapa detik
        proxy_send_timeout 120s;
    }
}
