<article class="card kabar mb-3"><div class="card-body d-flex gap-3 align-items-start">
  <div class="kabar-ikon text-bg-{{ k.warna }}" aria-hidden="true"><i class="bi {{ k.ikon }}"></i></div>
  <div class="flex-grow-1 min-w-0">
    <div class="kabar-judul">{{ k.judul }}</div>
    <div class="kabar-teks">{{ k.teks }}</div>
    <div class="small text-muted">{{ k.ket }}</div>
  </div>
  <a class="btn btn-primary kabar-tombol" href="{{ k.url }}">{{ k.tombol }}</a>
</div></article>
